<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="description" content="Tenis Cafe — Tenis Kulübü Mutfak & Bar. Başlangıçlardan ana yemeklere, atıştırmalıklardan içeceklere tüm menümüzü keşfedin.">
  <meta name="theme-color" content="#0c1a12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Tenis Cafe — Menü</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎾</text></svg>">
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div id="app">

    <!-- Sticky Header -->
    <header class="header" id="header">
      <div class="header-content">
        <div class="header-logo">🎾</div>
        <div class="header-text">
          <h1>Tenis Cafe</h1>
          <p>Tenis Kulübü Mutfak &amp; Bar</p>
        </div>

        <!-- Language Switcher -->
        <div class="lang-switcher">
          <button class="lang-btn active" data-lang="tr">TR</button>
          <span class="lang-divider">|</span>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
      </div>

      <!-- Search -->
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input
          type="search"
          id="search-input"
          class="search-input"
          placeholder="Menüde ara..."
          autocomplete="off"
        >
      </div>

      <!-- Category Tabs -->
      <nav class="category-nav" id="category-nav" aria-label="Menü kategorileri">
      </nav>
    </header>

    <!-- Menu Content -->
    <main id="menu-container" aria-label="Menü öğeleri">
    </main>

    <!-- Footer -->
    <footer class="footer">
      <span class="tennis-ball">🎾</span> Tenis Cafe &copy; 2026 &mdash; Tüm hakları saklıdır
    </footer>

  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
