<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="description" content="Ace Café — Tennis Club Kitchen & Bar. Browse our full menu, from starters and mains to match day snacks and refreshing drinks.">
  <meta name="theme-color" content="#0c1a12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Ace Café — Tennis Club Menu</title>

  <!-- Favicon — tennis ball emoji as SVG -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎾</text></svg>">

  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div id="app">

    <!-- Sticky Header -->
    <header class="header" id="header">
      <div class="header-content">
        <div class="header-logo">🎾</div>
        <div class="header-text">
          <h1>Ace Café</h1>
          <p>Tennis Club Kitchen &amp; Bar</p>
        </div>
      </div>

      <!-- Search -->
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input
          type="search"
          id="search-input"
          class="search-input"
          placeholder="Search menu..."
          autocomplete="off"
        >
      </div>

      <!-- Category Tabs -->
      <nav class="category-nav" id="category-nav" aria-label="Menu categories">
        <!-- JS renders tabs here -->
      </nav>
    </header>

    <!-- Menu Content -->
    <main id="menu-container" aria-label="Menu items">
      <!-- JS renders menu items here -->
    </main>

    <!-- Footer -->
    <footer class="footer">
      <span class="tennis-ball">🎾</span> Ace Café &copy; 2026 &mdash; All rights reserved
    </footer>

  </div>

  <script src="main.js"></script>
</body>
</html>
